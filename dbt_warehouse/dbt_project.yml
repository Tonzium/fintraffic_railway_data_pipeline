
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_warehouse'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_warehouse'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Variables
vars:
  staging_path: '../data/staging'
  # Days re-read and replaced by each incremental run of bronze_train_departures.
  # demo/run_pipeline.sh passes BACKFILL_DAYS here so it matches the ingestion window.
  reload_days: 7
  # History kept in bronze; older days are deleted (demo passes RETENTION_DAYS).
  retention_days: 365

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_warehouse:
    # Bronze layer configuration
    bronze:
      +materialized: table
      +schema: bronze
      bronze_stations:
        +materialized: table
      bronze_train_departures:
        # incremental strategy, unique key and retention live in the model file
        +materialized: incremental
        +on_schema_change: 'append_new_columns'

    # Silver layer configuration
    silver:
      +materialized: table
      +schema: silver

    # Gold layer configuration
    gold:
      +materialized: table
      +schema: gold