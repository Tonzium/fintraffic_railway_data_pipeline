# Self-hosted demo stack for railway.tonikiuru.com
#
#   docker compose -f docker-compose.demo.yml up -d --build
#
# Services:
#   pipeline    - fetches Digitraffic data, runs dbt, builds Evidence static site
#                 (once at startup, then daily at 07:00 Europe/Helsinki)
#   web         - nginx serving the built site (web:80 inside Docker, port 3000 on the host)
#   cloudflared - Cloudflare Tunnel (needs CLOUDFLARE_TUNNEL_TOKEN in .env)
#
# Settings come from .env next to this file (see .env.example).

# Rotate container logs so they cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  pipeline:
    container_name: railway-pipeline
    build:
      context: .
      dockerfile: demo/Dockerfile
    # tini as PID 1 forwards stop signals, so `docker stop` does not wait 10 s and SIGKILL.
    init: true
    environment:
      - TZ=${TZ:-Europe/Helsinki}
      - UPDATE_HOUR=${UPDATE_HOUR:-7}
      - BACKFILL_DAYS=${BACKFILL_DAYS:-7}
      - RETENTION_DAYS=${RETENTION_DAYS:-365}
      - RUN_TIMEOUT=${RUN_TIMEOUT:-3h}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=4096}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-4GB}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-2}
    volumes:
      - railway_data:/app/data
      - railway_site:/site
    logging: *default-logging
    restart: unless-stopped

  web:
    container_name: railway-web
    image: nginx:alpine
    volumes:
      - railway_site:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    logging: *default-logging
    restart: unless-stopped

  cloudflared:
    container_name: railway-cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - web

volumes:
  railway_data:
    name: railway_data
  railway_site:
    name: railway_site
