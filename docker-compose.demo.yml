# Self-hosted demo stack for railway.tonikiuru.com
#
#   docker compose -f docker-compose.demo.yml up -d --build
#
# Services:
#   pipeline    - fetches Digitraffic data, runs dbt, builds Evidence static site
#                 (once at startup, then daily at 07:00 Europe/Helsinki)
#   web         - nginx serving the built site on port 3000
#   cloudflared - Cloudflare Tunnel (needs CLOUDFLARE_TUNNEL_TOKEN in .env)
services:

  pipeline:
    container_name: railway-pipeline
    build:
      context: .
      dockerfile: demo/Dockerfile
    environment:
      - TZ=${TZ:-Europe/Helsinki}
      - UPDATE_HOUR=${UPDATE_HOUR:-7}
      - BACKFILL_DAYS=${BACKFILL_DAYS:-7}
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - railway_data:/app/data
      - railway_site:/site
    restart: unless-stopped

  web:
    container_name: railway-web
    image: nginx:alpine
    volumes:
      - railway_site:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    restart: unless-stopped

  cloudflared:
    container_name: railway-cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - web

volumes:
  railway_data:
    name: railway_data
  railway_site:
    name: railway_site
