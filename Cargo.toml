[package]
name = "railway-pipeline-tui"
version = "0.1.0"
edition = "2021"
authors = ["Toni Kiuru <tonikiuru@kamk.fi>"]
description = "Terminal UI for Fintraffic Railway Data Pipeline Automation"

[dependencies]
# Terminal UI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime for running processes
tokio = { version = "1.42", features = ["full"] }

# Process execution
tokio-process = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Colored terminal output
colored = "2.2"

# Date/time handling
chrono = "0.4"

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "railway-tui"
path = "src/main.rs"
