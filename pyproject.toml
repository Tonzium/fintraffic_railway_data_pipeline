[project]
name = "toni-data-alusta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Toni Kiuru", email = "tonikiuru@kamk.fi" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.0",
    "requests>=2.32.5",
    "dbt-core>=1.7.0,<2.0.0",
    "dbt-duckdb>=1.7.0,<2.0.0",
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "plotly>=5.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
